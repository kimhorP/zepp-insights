[project]
name = "zepp-insights"
version = "0.3.0"
description = "Local-first health analytics for Amazfit watches: ETL, dashboards, and AI insights"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests",
    "python-dotenv",
    "flask",
]

[project.urls]
Repository = "https://github.com/evankp/zepp-insights"

[tool.setuptools.packages.find]
include = ["etl*", "db*"]
